<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <title>lcatania</title>
</head>
<style>
    body {
        background-color: #e2e8f0;
    }


    #container {
        margin: auto;
        padding-left: 10px;
        padding-right: 10px;
        padding-bottom: 20px;
        width: 700px;
    }

    h1,
    span,
    p,
    a,
    li,
    a {
        font-family: "Source Code Pro", monospace;
        font-optical-sizing: auto;
        font-style: normal;
    }

    p {
        display: block;
    }

    .angular {
        color: red;
    }

    .c-sharp {
        color: #1A9F1F;
    }

    .golang {
        color: #67CFDD;
    }

    .nestjs {
        color: #EA2960;
    }

    img {
        transition: all 100ms ease-in;
        border-radius: 50%;
    }

    img:hover {
        border-radius: 0%;
    }

    @media only screen and (max-width: 768px) {
        #container {
            width: 100%;
        }
    }
</style>

<body>
    <div id="container">
        <section>

            <h1 style="display: flex;align-items: center;gap: 0px 20px;"><img width="75" height="75"
                    src="https://avatars.githubusercontent.com/u/41628606?v=4" />Lorenzo Catania</h1>

                I love fiddling with new technology.
                <br />
                <br />
                My current professional stack is: <span class="angular">Angular</span>, <span class="c-sharp">C#</span>,
                <span class="nestjs">NestJS</span>
                <br />
                <br />
                In my spare time i build small games in <span class="golang">go</span>
            </p>
            <span>you can find me at:</span>
            <ul>
                <li><a href="github.com/lctania">github @lcatania</a></li>
                <li><a href="github.com/lctania">instagram @hi.iam.lolo</a></li>
            </ul>
        </section>
    </div>
</body>

</html>
